services:
  # Pipeline event log + idempotency + Sheet retry queue (read by the dashboard
  # "Logs" panel). Deliberately NOT the Google Sheet: the most important event
  # to record is "the Sheet write failed", and a Sheets-backed log goes blind
  # during exactly that outage.
  postgres:
    image: postgres:16-alpine
    container_name: pfe-postgres
    restart: unless-stopped
    # Published on the loopback address only: the compose comment above says the
    # api reaches it over the network as `postgres:5432`, and .env holds
    # localhost:5432 for the host-run uvicorn / pytest dev flow. Binding to
    # 127.0.0.1 (not 0.0.0.0) keeps it off the machine's public interface — a
    # loopback socket is unreachable from the internet, so the "open door on a
    # server" concern that motivated no-publish still holds.
    # Credentials: the password has deliberately NO `:-fallback` default — a
    # clone without .env must fail loudly at start, not quietly run Postgres
    # with password "pfe" (the pre-2026-08-03 default) on a machine that may
    # face the web. User and database name are not secrets and keep their
    # defaults, since the pg_data volume was created with them.
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-pfe}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-pfe_logs}
      - TZ=Africa/Casablanca
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pfe} -d ${POSTGRES_DB:-pfe_logs}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: pfe-n8n
    restart: unless-stopped
    # Reached through the `web` proxy: /webhook/* for Meta and Telegram, and
    # nothing else. The editor UI is deliberately not public -- open it with
    # `docker compose port`-free SSH forwarding, or temporarily re-add a port.
    environment:
      - GENERIC_TIMEZONE=Africa/Casablanca
      - TZ=Africa/Casablanca
      - N8N_DIAGNOSTICS_ENABLED=false
      # webhook URLs n8n auto-registers with Telegram must use the public tunnel/server URL
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5678/}
      # WhatsApp Cloud API (second reception channel, see n8n/README.md §8)
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID:-}
      # Meta's webhook challenge string, echoed back by the manual GET webhook
      # (n8n's own WhatsApp Trigger fails Meta's verification, hence the manual
      # node). It was a literal inside the workflow JSON until 2026-08-11 —
      # harmless-looking, but a workflow file is meant to be reviewable and a
      # shared secret in it is one copy-paste from being published. No default:
      # an unset value must fail the challenge loudly, never match "".
      - WHATSAPP_VERIFY_TOKEN=${WHATSAPP_VERIFY_TOKEN}
      # Meta's app secret, used by `Extract WA msgs` to verify the
      # X-Hub-Signature-256 on every inbound delivery. Unset means the
      # signature is NOT checked and the Code node says so in the log --
      # fail-open on purpose, because failing closed here would silence
      # WhatsApp reception the moment the workflow is imported without it.
      - WHATSAPP_APP_SECRET=${WHATSAPP_APP_SECRET:-}
      # Telegram polling (unified reception workflow reads $env.TELEGRAM_BOT_TOKEN)
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      # Sheet target and the HR address the workflow gives to outsiders. Kept
      # out of the workflow JSON so the file can live in a public repo: the
      # Sheet ID is effectively read access to every technician report if the
      # document is link-shared, and the address is worth scraping.
      - GOOGLE_SHEET_ID=${GOOGLE_SHEET_ID:-}
      - HR_EMAIL=${HR_EMAIL:-}
      # allow Code nodes / expressions to read $env.* (blocked by default in n8n 1.x+)
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      # The workflow reads $env.API_BASE_URL for /process, /logs and /sheet-queue.
      # Default targets the api service below; override to host.docker.internal:8000
      # when running uvicorn on the host instead (dev with --reload).
      - API_BASE_URL=${API_BASE_URL:-http://api:8000}
      # Every workflow call to the API sends this as X-API-Key. n8n has no
      # browser and therefore no session cookie; without it the whole pipeline
      # 401s the moment authentication is switched on.
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # NOTE: n8n's built-in tunnel (start --tunnel) is dead in modern n8n (2.x ignores it) — use Tailscale Funnel, see n8n/README.md
    volumes:
      - n8n_data:/home/node/.n8n
    ports:
    - "5678:5678"

  # The AI microservice n8n calls. Containerised so the pipeline comes back on
  # its own after a reboot — a host-run uvicorn does not, and WhatsApp then
  # reaches n8n but every /process call fails (technician gets "❌ Erreur").
  api:
    build: ./api
    container_name: pfe-api
    restart: unless-stopped
    # Reached as `api:8000` by both n8n and the web proxy. Publishing it would
    # expose a second origin for the same API, which is precisely what the
    # same-origin design exists to avoid.
    env_file: .env
    environment:
      # .env holds localhost:5432 for a host-run uvicorn; inside this network the
      # host is the compose service name. `environment` wins over `env_file`, so
      # both run modes work without editing .env.
      - DATABASE_URL=postgresql://${POSTGRES_USER:-pfe}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pfe_logs}
      # Absolute on purpose: sheets.py anchors a *relative* key path to
      # Path(__file__).parents[2], which is the repo root on the host but "/" in
      # this image (api/app → /app/app). Absolute skips that resolution.
      - GOOGLE_SERVICE_ACCOUNT_JSON=/app/credentials/service-account.json
      # The `local` engine of stt_chain. Set here rather than in .env because
      # the hostname is compose-internal: a host-run uvicorn needs
      # 127.0.0.1:8100 instead, and `environment` wins over `env_file` so both
      # run modes work without editing .env — same trick as DATABASE_URL above.
      # Unset would mean the chain silently skips its most accurate engine.
      - STT_LOCAL_URL=http://stt-local:8100
      - TZ=Africa/Casablanca
    depends_on:
      postgres:
        condition: service_healthy
      # No condition: the sidecar is one engine of a fallback chain, so the API
      # must come up and serve even when it is unhealthy or absent. Requiring it
      # would let a GPU problem take down the whole pipeline — the opposite of
      # what a chain is for.
      stt-local:
        condition: service_started
    volumes:
      - ./credentials:/app/credentials:ro

  # Local Darija STT — the GPU sidecar behind `api/app/providers/local_darija.py`,
  # winner of the 2026-08-07 benchmark. It sits at position 2 of the
  # `gemini,local,groq` chain (config.py, ordered by accuracy since 2026-08-08),
  # so it answers when Gemini fails rather than on every note.
  #
  # It preloads the model at startup (STT_LOCAL_PRELOAD below), holding ~4 GB of
  # the 8 GB card around the clock. The lazy load it replaced saved that VRAM by
  # charging the load — measured 280-394 s on the 3070 — to the first caller,
  # i.e. to the one technician for whom Gemini had just failed; and since the
  # client budget was under the load time, that first call always failed.
  # Set STT_LOCAL_PRELOAD=0 to get the lazy behaviour back.
  #
  # No published port and no auth of its own — same posture as `api`, reachable
  # only as `stt-local:8100` inside this network.
  stt-local:
    build: ./benchmark
    container_name: pfe-stt-local
    restart: unless-stopped
    environment:
      - TZ=Africa/Casablanca
      # Load the model at startup instead of on the first /transcribe. Lazy was
      # the original choice, made before we measured that the first call ALWAYS
      # timed out — and that failing warmed the model, so the retry passed and
      # it read as "slow the first time". Set to 0 to get the lazy behaviour
      # back if the card is needed for something else.
      - STT_LOCAL_PRELOAD=1
    # The weights are NOT in the image and NOT in git: 5.8 GB total, largest
    # shard 4.7 GB, which is over GitHub's 2 GB Git-LFS per-file ceiling. They
    # are produced by `python download_models.py` and mounted read-only —
    # the container must never be able to corrupt a 5.8 GB download.
    volumes:
      - ./benchmark/models:/app/models:ro
    # Verified working on this machine: `docker run --rm --gpus all
    # nvidia/cuda:12.6.0-base-ubuntu24.04 nvidia-smi -L` reports the RTX 3070
    # through Docker Desktop's WSL2 backend. Without this block the container
    # starts fine and silently runs on CPU at 60-180 s per note, so a missing
    # GPU shows up as "mysteriously slow", not as an error.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # The only service with a published port: one origin serving the dashboard,
  # the API under /api, and n8n's webhooks under /webhook. That is what keeps the
  # session cookie SameSite=Lax and makes CORS a non-issue -- and it is the same
  # shape locally, behind the Tailscale Funnel, and on the aznet server. Only the
  # hostname in front of it changes.
  web:
    build: ./Dashboard
    container_name: pfe-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      - api
      - n8n

volumes:
  n8n_data:
  pg_data:
