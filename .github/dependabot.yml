version: 2
updates:
  - package-ecosystem: npm
    directory: /Dashboard
    schedule:
      interval: daily
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: pip
    directory: /api
    schedule:
      interval: daily
    groups:
      pip-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: docker
    directory: /api
    schedule:
      interval: daily
    groups:
      docker-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: docker
    directory: /Dashboard
    schedule:
      interval: daily
    groups:
      docker-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
