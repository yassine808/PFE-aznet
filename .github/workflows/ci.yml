name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push supersedes the previous run on the same ref. Without this, a burst
# of commits queues runs that can only report on code nobody is looking at.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"

jobs:
  # Runs first and alone: a leaked credential is the one failure where the rest
  # of the pipeline's result does not matter.
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: a secret removed in HEAD is still public
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Committed credentials (tracked files)
        run: python scripts/check_secrets.py
      - name: Gitleaks (full history)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  api:
    name: API — lint, types & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    # A real Postgres, not a psycopg2 fake. `logs.py` is 915 coverable lines the
    # offline suite cannot reach — with no DATABASE_URL every function raises
    # before it reaches SQL — and mocking the driver would execute those lines
    # without any database ever parsing the statements. The tests that use it
    # are marked `integration` and key on TEST_DATABASE_URL, a variable the
    # application never reads: `pytest` on a developer box still needs no
    # database, which is the rule this repository is built on.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pfe
          POSTGRES_PASSWORD: pfe
          POSTGRES_DB: pfe_test
        ports: ["5432:5432"]
        # Without this the job races the container: psycopg2 connects to a
        # port that is open before Postgres is accepting queries.
        options: >-
          --health-cmd "pg_isready -U pfe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: "pip install --require-hashes --only-binary=:all: -r requirements.txt -r requirements-dev.txt"
      # Rule set pinned in api/ruff.toml — bugs only, not style. See the file.
      - name: Ruff
        run: ruff check app/ tests/
      # No API keys and no database: external SDKs are lazy-imported and mocked
      # at the boundary. If this ever needs a secret, the test is wrong.
      # --cov writes api/coverage.xml, which the `sonar` job below reads. No
      # threshold is enforced: the suite is offline by construction, so a line
      # coverage gate would reward tests that touch code without exercising the
      # network contracts where the real defects have all been (see §4.4).
      - name: Pytest
        env:
          TEST_DATABASE_URL: postgresql://pfe:pfe@localhost:5432/pfe_test
        run: python -m pytest -q --tb=short --cov=app --cov-report=xml
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: api/coverage.xml
          if-no-files-found: error

  dashboard:
    name: Dashboard — types, lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Dashboard/package-lock.json
      - run: npm ci --ignore-scripts
      - name: TypeScript
        run: npm exec --ignore-scripts -- tsc -b --noEmit
      # Warnings do not fail the build; errors do. The current tree is warning-only.
      - name: Oxlint
        run: npm exec --ignore-scripts -- oxlint
      # The one piece of dashboard logic that can be wrong without looking
      # wrong: a next-run line is plausible whatever date it prints. Node
      # strips the types itself, so this needs no test framework.
      - name: Schedule self-check
        run: node scripts/check-schedule.mjs
      # The build is the real gate: tsc does not catch a broken import path,
      # a missing asset or a Tailwind v4 token that does not resolve.
      - name: Build
        run: npm run build

  workflow:
    name: n8n workflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # n8n reports a bad expression only at runtime, on the node that uses it,
      # which costs a technician their reply. Catch it here instead.
      - name: Validate expressions and connections
        run: python scripts/check_workflow.py

  compose:
    name: Docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # compose reads env_file: .env, gitignored — .env.example has the same keys.
      - run: cp .env.example .env
      - name: Validate compose file
        run: docker compose config --quiet

  i18n:
    name: Locale key parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # fr is the reference; a key added to one file and not the others ships a
      # raw key string to whoever switched language.
      - name: fr / en / ar have the same keys
        run: python scripts/check_locales.py

  # External static analysis. Runs after `api` because it consumes that job's
  # coverage report -- without it SonarCloud reports 0 % and the quality gate
  # fails on a metric nothing measured.
  #
  # PREREQUISITE, one manual step: SonarCloud's *Automatic Analysis* must be
  # switched off (project -> Administration -> Analysis Method). The two modes
  # are mutually exclusive; while automatic analysis is on, this job fails with
  # "you are running manual analysis while Automatic Analysis is enabled", and
  # automatic analysis cannot ingest a coverage report at all.
  sonar:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: api
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # blame data: Sonar attributes new code to a commit
      - uses: actions/download-artifact@v4
        with:
          name: api-coverage
          path: api
      # Fatal, unlike the security scans below. This step does not judge the
      # code -- it only proves the analysis ran -- so the only way it fails is a
      # configuration fault: a missing or expired SONAR_TOKEN, an unreadable
      # coverage.xml, Automatic Analysis switched back on. Every one of those
      # means the figures on sonarcloud.io are stale while CI shows green, which
      # is exactly what happened between 15 and 18 August 2026 and went unnoticed
      # because this step was `continue-on-error`.
      #
      # The quality gate itself is deliberately NOT awaited (no
      # -Dsonar.qualitygate.wait): gate results are read on sonarcloud.io.
      #
      # That gate is a project-specific one, "PFE Aznet", not Sonar way. Its
      # only difference is coverage on new code at 60 % instead of 80 %, set on
      # 2026-08-21 after the gate went red at 44.6 %. Two facts decided the
      # number rather than taste: coverage was averaging the API's measured
      # 66.6 % with the dashboard's 0 %, which measures the absence of a test
      # runner and not the code (fixed separately, in sonar-project.properties);
      # and the remaining 1342 uncovered API lines are concentrated in the four
      # modules the suite is *designed* not to execute -- logs.py (Postgres),
      # sheets.py (Google), jobs.py (the 03:00 daemon) and the endpoints in
      # main.py that write through them -- because tests must pass with no API
      # keys and no database. Reaching 80 % means either a postgres service
      # container here (a real improvement, and a real change to that rule) or
      # mocking psycopg2 deep enough to run SQL no database ever parses, which
      # buys the number by spending its meaning. See §4.9.4.
      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  # --- Security jobs below: continue-on-error on the scan step only, so a
  # finding never blocks a merge (not enforced yet) but infra failures
  # (checkout, setup, missing tool) still fail the job loudly.

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - name: Analyze
        continue-on-error: true
        uses: github/codeql-action/analyze@v3

  semgrep:
    name: Semgrep (OWASP Top 10)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep:1.172.0
    steps:
      - uses: actions/checkout@v4
      # Unauthenticated public ruleset — no Semgrep AppSec Platform account,
      # matches the zero-budget constraint.
      - name: Semgrep scan
        continue-on-error: true
        run: semgrep scan --config=p/owasp-top-ten --sarif --output=semgrep.sarif
      # Non-fatal: the scan itself already runs with continue-on-error, so a
      # finding never gates CI -- only the upload did. Uploading needs code
      # scanning to accept SARIF for this repo; when it does not, the whole
      # job went red for a reason unrelated to the code under test. The scan
      # still runs and the SARIF is still produced as an artifact.
      - uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  trivy-fs:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Trivy fs scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
      # Non-fatal: the scan itself already runs with continue-on-error, so a
      # finding never gates CI -- only the upload did. Uploading needs code
      # scanning to accept SARIF for this repo; when it does not, the whole
      # job went red for a reason unrelated to the code under test. The scan
      # still runs and the SARIF is still produced as an artifact.
      - uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  trivy-config:
    name: Trivy config scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Trivy config scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-config.sarif
      # Non-fatal: the scan itself already runs with continue-on-error, so a
      # finding never gates CI -- only the upload did. Uploading needs code
      # scanning to accept SARIF for this repo; when it does not, the whole
      # job went red for a reason unrelated to the code under test. The scan
      # still runs and the SARIF is still produced as an artifact.
      - uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        if: always()
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

  bandit:
    name: Bandit SAST
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: 'pip install --only-binary=:all: "bandit[sarif]==1.8.6"'
      - name: Bandit
        continue-on-error: true
        run: bandit -r api/ scripts/ benchmark/ -f sarif -o bandit.sarif
      # Non-fatal: the scan itself already runs with continue-on-error, so a
      # finding never gates CI -- only the upload did. Uploading needs code
      # scanning to accept SARIF for this repo; when it does not, the whole
      # job went red for a reason unrelated to the code under test. The scan
      # still runs and the SARIF is still produced as an artifact.
      - uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        if: always()
        with:
          sarif_file: bandit.sarif
          category: bandit

  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: "pip install --only-binary=:all: pip-audit==2.9.0"
      - name: pip-audit
        continue-on-error: true
        run: pip-audit -r requirements.txt

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Dashboard/package-lock.json
      - run: npm ci --ignore-scripts
      - name: npm audit
        continue-on-error: true
        run: npm audit --audit-level=high

  hadolint:
    name: Hadolint (${{ matrix.dockerfile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dockerfile: [api/Dockerfile, Dashboard/Dockerfile]
    steps:
      - uses: actions/checkout@v4
      - name: Hadolint
        continue-on-error: true
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: ${{ matrix.dockerfile }}

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        continue-on-error: true
        uses: reviewdog/action-actionlint@50842263c20a7c46bd0065b9e624d3c569db061e # v1.73.0
