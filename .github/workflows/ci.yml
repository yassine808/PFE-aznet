name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push supersedes the previous run on the same ref. Without this, a burst
# of commits queues runs that can only report on code nobody is looking at.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.9"
  NODE_VERSION: "22"

jobs:
  # Runs first and alone: a leaked credential is the one failure where the rest
  # of the pipeline's result does not matter.
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: a secret removed in HEAD is still public
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Committed credentials (tracked files)
        run: python scripts/check_secrets.py
      - name: Gitleaks (full history)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  api:
    name: API — lint, types & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: "pip install --require-hashes --only-binary=:all: -r requirements.txt -r requirements-dev.txt"
      # Rule set pinned in api/ruff.toml — bugs only, not style. See the file.
      - name: Ruff
        run: ruff check app/ tests/
      # No API keys and no database: external SDKs are lazy-imported and mocked
      # at the boundary. If this ever needs a secret, the test is wrong.
      - name: Pytest
        run: python -m pytest -q --tb=short

  dashboard:
    name: Dashboard — types, lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Dashboard/package-lock.json
      - run: npm ci --ignore-scripts
      - name: TypeScript
        run: npm exec --ignore-scripts -- tsc -b --noEmit
      # Warnings do not fail the build; errors do. The current tree is warning-only.
      - name: Oxlint
        run: npm exec --ignore-scripts -- oxlint
      # The build is the real gate: tsc does not catch a broken import path,
      # a missing asset or a Tailwind v4 token that does not resolve.
      - name: Build
        run: npm run build

  workflow:
    name: n8n workflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # n8n reports a bad expression only at runtime, on the node that uses it,
      # which costs a technician their reply. Catch it here instead.
      - name: Validate expressions and connections
        run: python scripts/check_workflow.py

  compose:
    name: Docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # compose reads env_file: .env, gitignored — .env.example has the same keys.
      - run: cp .env.example .env
      - name: Validate compose file
        run: docker compose config --quiet

  i18n:
    name: Locale key parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # fr is the reference; a key added to one file and not the others ships a
      # raw key string to whoever switched language.
      - name: fr / en / ar have the same keys
        run: python scripts/check_locales.py

  # --- Security jobs below: continue-on-error on the scan step only, so a
  # finding never blocks a merge (not enforced yet) but infra failures
  # (checkout, setup, missing tool) still fail the job loudly.

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - name: Analyze
        continue-on-error: true
        uses: github/codeql-action/analyze@v3

  semgrep:
    name: Semgrep (OWASP Top 10)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep:1.172.0
    steps:
      - uses: actions/checkout@v4
      # Unauthenticated public ruleset — no Semgrep AppSec Platform account,
      # matches the zero-budget constraint.
      - name: Semgrep scan
        continue-on-error: true
        run: semgrep scan --config=p/owasp-top-ten --sarif --output=semgrep.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  trivy-fs:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Trivy fs scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  trivy-config:
    name: Trivy config scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Trivy config scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-config.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

  bandit:
    name: Bandit SAST
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: 'pip install --only-binary=:all: "bandit[sarif]==1.8.6"'
      - name: Bandit
        continue-on-error: true
        run: bandit -r api/ scripts/ benchmark/ -f sarif -o bandit.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: bandit.sarif
          category: bandit

  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: "pip install --only-binary=:all: pip-audit==2.9.0"
      - name: pip-audit
        continue-on-error: true
        run: pip-audit -r requirements.txt

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Dashboard/package-lock.json
      - run: npm ci --ignore-scripts
      - name: npm audit
        continue-on-error: true
        run: npm audit --audit-level=high

  hadolint:
    name: Hadolint (${{ matrix.dockerfile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dockerfile: [api/Dockerfile, Dashboard/Dockerfile]
    steps:
      - uses: actions/checkout@v4
      - name: Hadolint
        continue-on-error: true
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: ${{ matrix.dockerfile }}

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        continue-on-error: true
        uses: reviewdog/action-actionlint@50842263c20a7c46bd0065b9e624d3c569db061e # v1.73.0
