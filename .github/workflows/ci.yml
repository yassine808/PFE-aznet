name: CI

on: [push, pull_request]

env:
  PYTHON_VERSION: "3.9"
  NODE_VERSION: "22"

jobs:
  api-tests:
    name: API - tests & lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: pip install -r requirements.txt
      - run: pip install ruff
      - name: Ruff check
        run: ruff check app/ tests/ || true
      - name: Pytest
        run: python -m pytest -v --tb=short

  dashboard-checks:
    name: Dashboard - lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install
      - name: TypeScript check
        run: npx tsc -b --noEmit
      - name: Oxlint
        run: npx oxlint || true

  prettier:
    name: Prettier check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm init -y
      - run: npm install --save-dev prettier@^3.5
      - name: Check formatting
        run: npx prettier --check "**/*.{md,yaml,yml,json,py}" --ignore-unknown || true
