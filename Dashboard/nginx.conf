# The single public door. Everything the outside world reaches goes through
# here, which is what makes the dashboard same-origin with the API: the login
# cookie stays SameSite=Lax and CORS never enters the picture.
#
# Port 8080, plain HTTP: TLS is terminated upstream (Tailscale Funnel now, the
# aznet server's certificate later). The browser still sees HTTPS, which is what
# COOKIE_SECURE is about.
server {
    listen 8080;
    server_name _;

    # Text payloads compress ~6-8x. The API's JSON polls (/reports, /logs)
    # come through proxy_pass, so gzip_proxied any is what makes them cheap
    # too; woff2 is already compressed and is deliberately not listed.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # Voice notes and photos come through /api/process; the default 1 MB would
    # reject anything but the shortest clip.
    client_max_body_size 25m;

    # The dashboard, built by the first stage of the Dockerfile.
    root /usr/share/nginx/html;
    index index.html;

    # Hashed asset filenames are immutable, so they can be cached hard. index.html
    # must not be, or a deploy leaves browsers on the previous bundle.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Everything the dashboard calls, including GET /api/n8n/* -- those routes
    # live on the API (behind require_human) rather than being proxied straight
    # to n8n here, so this file holds no credentials at all.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 460s, not the original 180s: the local Darija engine loads its model on
        # the FIRST /transcribe rather than at startup (so it does not pin 4 GB of
        # an 8 GB card around the clock), and that cold start was MEASURED at 280 s
        # on 2026-08-16 — which is why `local_darija._http()` allows 420 s (load +
        # transcribe + headroom). At 180 s nginx gave up before
        # its own client did, and the 504 landed on the worst possible day: the
        # `local` engine is third in the chain, so it only runs once Gemini AND
        # Groq have already failed. Verified 2026-08-16 by sending a real note
        # with provider=local through this proxy: HTTP 504 from nginx while the
        # model was still loading. Must stay ABOVE the client's 420 s or the
        # proxy silently caps a timeout the API thinks it owns.
        #
        # n8n is unaffected either way — it reaches http://api:8000 directly
        # (API_BASE_URL), so this only ever bit browser-originated calls.
        proxy_read_timeout 460s;
    }

    # Meta and Telegram call these; they carry no session and must not be gated.
    # n8n has no published port any more, so without this the WhatsApp channel
    # goes silent -- and silence is exactly how a webhook failure presents.
    location /webhook/ {
        proxy_pass http://n8n:5678/webhook/;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /webhook-test/ {
        proxy_pass http://n8n:5678/webhook-test/;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Single-page app: unknown paths are client-side routes, not 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
