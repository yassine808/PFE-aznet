# SonarCloud. The key and organization are the ones SonarCloud provisioned from
# the GitHub repository -- NOT a name chosen here. An invented key silently
# creates a second, empty project instead of updating this one, which is why
# they are written out in full rather than left to a default.
# gitleaks:allow -- a public project key, not a credential. Its shape (a long
# opaque-looking token after '=') trips gitleaks' generic-api-key rule, which
# would otherwise fail the Secret scan job on a value printed in every
# SonarCloud URL.
sonar.projectKey=yassine808_PFE-aznet
sonar.organization=yassine808
sonar.projectName=PFE Aznet

sonar.sources=api/app,Dashboard/src
sonar.tests=api/tests
sonar.sourceEncoding=UTF-8

# 3.11 is what the API image, the venv and CI all run. Declaring 3.9 here made
# Sonar analyse the code against a syntax and a standard library that this
# project never targets.
sonar.python.version=3.11
sonar.typescript.tsconfigPath=Dashboard/tsconfig.json

# Produced by the `api` job (`pytest --cov`). The path is relative to this file,
# so it resolves from the repository root regardless of the job's
# working-directory.
sonar.python.coverage.reportPaths=api/coverage.xml
# The dashboard has no test runner yet, so this file does not exist and Sonar
# logs a warning rather than failing. Left in place because it is the path a
# future Vitest run would write to.
sonar.javascript.lcov.reportPaths=Dashboard/coverage/lcov.info

# Coverage is measured where a runner exists. The dashboard has none, so every
# one of its ~2000 lines counted as uncovered new code and dragged the gate to
# 44.6 % -- a figure about the absence of a test runner, not about the code.
# Excluding it reports the API's real 66.6 % instead of an average of a
# measurement and a non-measurement. Delete this line the day Vitest runs and
# writes the lcov path declared above.
sonar.coverage.exclusions=Dashboard/src/**
